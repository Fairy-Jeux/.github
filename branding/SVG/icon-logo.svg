<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="PVE Command Center Icon">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071124" />
      <stop offset="52%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0B1528" />
    </linearGradient>

    <radialGradient id="iconCyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 96) rotate(48) scale(360)">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.36" />
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="iconIndigoGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(410 400) rotate(225) scale(310)">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#FA233B" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0B1528" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="iconGlassSurface" x1="76" y1="76" x2="436" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20" />
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="iconGlassStroke" x1="76" y1="76" x2="436" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.36" />
    </linearGradient>

    <linearGradient id="iconBladeAccent" x1="138" y1="148" x2="374" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed dark square backdrop for clean GitHub Organization avatar cropping -->
  <rect x="0" y="0" width="512" height="512" fill="url(#iconBg)" />
  <rect x="0" y="0" width="512" height="512" fill="url(#iconCyanGlow)" />
  <rect x="0" y="0" width="512" height="512" fill="url(#iconIndigoGlow)" />

  <!-- Centered Liquid Glass Tile -->
  <rect x="76" y="76" width="360" height="360" rx="92" fill="url(#iconGlassSurface)" stroke="url(#iconGlassStroke)" stroke-width="4" />
  <path d="M160 78 L352 78 L412 172 L256 434 L104 210 Z" fill="#22D3EE" fill-opacity="0.04" />

  <!-- Three stacked server blades -->
  <rect x="138" y="148" width="236" height="56" rx="18" fill="#0F172A" fill-opacity="0.82" stroke="url(#iconBladeAccent)" stroke-width="3" />
  <circle cx="172" cy="176" r="8" fill="#22D3EE" />
  <rect x="196" y="170" width="94" height="12" rx="6" fill="#E2E8F0" fill-opacity="0.86" />
  <circle cx="340" cy="176" r="6" fill="#34D399" />

  <rect x="138" y="228" width="236" height="56" rx="18" fill="#0F172A" fill-opacity="0.82" stroke="#6366F1" stroke-opacity="0.54" stroke-width="2.5" />
  <circle cx="172" cy="256" r="8" fill="#818CF8" />
  <rect x="196" y="250" width="112" height="12" rx="6" fill="#CBD5E1" fill-opacity="0.74" />
  <circle cx="340" cy="256" r="6" fill="#06B6D4" />

  <rect x="138" y="308" width="236" height="56" rx="18" fill="#0F172A" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2.5" />
  <circle cx="172" cy="336" r="8" fill="#34D399" />
  <rect x="196" y="330" width="78" height="12" rx="6" fill="#CBD5E1" fill-opacity="0.64" />
  <circle cx="340" cy="336" r="12" fill="#FA233B" fill-opacity="0.22" />
  <circle cx="340" cy="336" r="6" fill="#FA233B" />
</svg>
