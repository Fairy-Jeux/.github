<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" fill="none" role="img" aria-label="PVE Command Center — Homelab and Proxmox VE Supervision Ecosystem">
  <defs>
    <clipPath id="lightBannerClip">
      <rect x="0" y="0" width="1280" height="360" rx="28" />
    </clipPath>

    <linearGradient id="lightBg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="52%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <radialGradient id="lightCyanOrb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 110) rotate(28) scale(480 340)">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="lightIndigoOrb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 48) rotate(145) scale(460 320)">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="lightCiderOrb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 325) rotate(195) scale(400 260)">
      <stop offset="0%" stop-color="#FA233B" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#FA233B" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="lightFrameStroke" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#06B6D4" stop-opacity="0.32" />
      <stop offset="75%" stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FA233B" stop-opacity="0.22" />
    </linearGradient>

    <linearGradient id="lightGlassTile" x1="84" y1="68" x2="308" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.94" />
      <stop offset="55%" stop-color="#F8FAFC" stop-opacity="0.84" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.72" />
    </linearGradient>

    <linearGradient id="lightGlassTileStroke" x1="84" y1="68" x2="308" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.45" />
      <stop offset="48%" stop-color="#06B6D4" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.48" />
    </linearGradient>

    <linearGradient id="lightAccentGrad" x1="360" y1="192" x2="580" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="52%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#FA233B" />
    </linearGradient>

    <linearGradient id="lightBladeTopStroke" x1="122" y1="110" x2="270" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="55%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <g clip-path="url(#lightBannerClip)">
    <rect x="0" y="0" width="1280" height="360" fill="url(#lightBg)" />
    <rect x="0" y="0" width="1280" height="360" fill="url(#lightCyanOrb)" />
    <rect x="0" y="0" width="1280" height="360" fill="url(#lightIndigoOrb)" />
    <rect x="0" y="0" width="1280" height="360" fill="url(#lightCiderOrb)" />

    <!-- Subtle studio grid lines -->
    <g stroke="#0F172A" stroke-opacity="0.05" stroke-width="1">
      <line x1="0" y1="90" x2="1280" y2="90" />
      <line x1="0" y1="180" x2="1280" y2="180" />
      <line x1="0" y1="270" x2="1280" y2="270" />
      <line x1="334" y1="0" x2="334" y2="360" />
      <line x1="640" y1="0" x2="640" y2="360" />
      <line x1="960" y1="0" x2="960" y2="360" />
    </g>

    <!-- Decorative right-side telemetry accent lines -->
    <path d="M1085 68 L1195 68 L1225 98 L1225 220" stroke="#06B6D4" stroke-opacity="0.24" stroke-width="1.5" />
    <path d="M1125 96 L1188 96 L1206 114 L1206 188" stroke="#FA233B" stroke-opacity="0.22" stroke-width="1.5" />
    <circle cx="1225" cy="220" r="3" fill="#06B6D4" fill-opacity="0.50" />
    <circle cx="1206" cy="188" r="3" fill="#FA233B" fill-opacity="0.45" />

    <!-- Frosted Pearl Liquid Glass Emblem -->
    <g>
      <rect x="84" y="68" width="224" height="224" rx="54" fill="url(#lightGlassTile)" stroke="url(#lightGlassTileStroke)" stroke-width="2.5" />
      <path d="M138 70 L254 70 L294 128 L196 290 L102 150 Z" fill="#06B6D4" fill-opacity="0.06" />

      <!-- Blade 1 -->
      <rect x="122" y="110" width="148" height="36" rx="12" fill="#0F172A" fill-opacity="0.92" stroke="url(#lightBladeTopStroke)" stroke-width="2.2" />
      <circle cx="144" cy="128" r="5.5" fill="#22D3EE" />
      <rect x="160" y="124" width="64" height="8" rx="4" fill="#F8FAFC" fill-opacity="0.90" />
      <circle cx="248" cy="128" r="4" fill="#34D399" />

      <!-- Blade 2 -->
      <rect x="122" y="162" width="148" height="36" rx="12" fill="#1E293B" fill-opacity="0.90" stroke="#6366F1" stroke-opacity="0.55" stroke-width="1.8" />
      <circle cx="144" cy="180" r="5.5" fill="#818CF8" />
      <rect x="160" y="176" width="74" height="8" rx="4" fill="#E2E8F0" fill-opacity="0.82" />
      <circle cx="248" cy="180" r="4" fill="#22D3EE" />

      <!-- Blade 3 -->
      <rect x="122" y="214" width="148" height="36" rx="12" fill="#1E293B" fill-opacity="0.86" stroke="#0F172A" stroke-opacity="0.22" stroke-width="1.8" />
      <circle cx="144" cy="232" r="5.5" fill="#34D399" />
      <rect x="160" y="228" width="52" height="8" rx="4" fill="#E2E8F0" fill-opacity="0.72" />
      <circle cx="248" cy="232" r="8.5" fill="#FA233B" fill-opacity="0.26" />
      <circle cx="248" cy="232" r="4.2" fill="#FA233B" />
    </g>

    <!-- Eyebrow Pill -->
    <g>
      <rect x="360" y="68" width="496" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1.2" />
      <circle cx="380" cy="83" r="4" fill="#06B6D4" />
      <circle cx="394" cy="83" r="4" fill="#6366F1" />
      <circle cx="408" cy="83" r="4" fill="#FA233B" />
      <text x="424" y="87" fill="#334155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">PROXMOX VE  &#183;  OPEN SOURCE  &#183;  ZERO TELEMETRY</text>
    </g>

    <!-- Main Heading -->
    <text x="360" y="172" fill="#0F172A" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-0.8">PVE COMMAND CENTER</text>

    <!-- Tri-color Liquid Glass & Cider Accent Rule -->
    <rect x="360" y="192" width="220" height="4" rx="2" fill="url(#lightAccentGrad)" />

    <!-- Subtitle -->
    <text x="360" y="232" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500">Homelab &amp; Proxmox VE Supervision Ecosystem</text>

    <!-- Platform Pills -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <rect x="360" y="262" width="172" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.86" stroke="#06B6D4" stroke-opacity="0.42" stroke-width="1.2" />
      <circle cx="378" cy="278" r="4" fill="#06B6D4" />
      <text x="390" y="282.5" fill="#0F172A">FastAPI &#183; React 19</text>

      <rect x="544" y="262" width="178" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.86" stroke="#6366F1" stroke-opacity="0.42" stroke-width="1.2" />
      <circle cx="562" cy="278" r="4" fill="#6366F1" />
      <text x="574" y="282.5" fill="#0F172A">Swift 6 &#183; Apple TV</text>

      <rect x="734" y="262" width="182" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.86" stroke="#FA233B" stroke-opacity="0.42" stroke-width="1.2" />
      <circle cx="752" cy="278" r="4" fill="#FA233B" />
      <text x="764" y="282.5" fill="#0F172A">Tauri v2 &#183; Android</text>

      <rect x="928" y="262" width="136" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.86" stroke="#10B981" stroke-opacity="0.42" stroke-width="1.2" />
      <circle cx="946" cy="278" r="4" fill="#10B981" />
      <text x="958" y="282.5" fill="#0F172A">MIT License</text>
    </g>
  </g>

  <!-- Crisp outer glass frame -->
  <rect x="1" y="1" width="1278" height="358" rx="27" stroke="url(#lightFrameStroke)" stroke-width="2" />
</svg>
